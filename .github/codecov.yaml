comment: false
github_checks:
  annotations: true

coverage:
  precision: 2
  range: '20...60'
  round: down
  status:
    changes: false
    patch:
      default:
        informational: true
    project:
      default:
        target: auto
        threshold: 5%

flags:
  app:
    paths:
      - packages/app/
  cepheus:
    paths:
      - packages/cepheus/
  cli:
    paths:
      - packages/cli/
  plugin:
    paths:
      - packages/plugin/
  utilities:
    paths:
      - packages/utilities/
  vue:
    paths:
      - packages/vue/
